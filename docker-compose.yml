version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyber-osint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_osint}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyber_osint}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyber_osint_network

  redis:
    image: redis:7-alpine
    container_name: cyber-osint-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyber_osint_network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: cyber-osint-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - cyber_osint_network

  minio:
    image: minio/minio:latest
    container_name: cyber-osint-minio
    restart: unless-stopped
    command: server /data --console-address "0.0.0.0:9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - cyber_osint_network

  worker:
    build: ./apps/api
    container_name: cyber-osint-worker
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_secure_pass@postgres:5432/cyber_osint}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARCH_URL: ${SEARCH_URL:-http://opensearch:9200}
      AI_API_KEY: ${AI_API_KEY:-your-ai-api-key-here}
      VIDEO_API_KEY: ${VIDEO_API_KEY:-your-video-api-key-here}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-your_github_token_here}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:cached
    depends_on:
      - postgres
      - redis
      - opensearch
      - minio
    networks:
      - cyber_osint_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  cyber_osint_network:
    driver: bridge

